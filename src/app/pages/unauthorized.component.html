<section class="flex min-h-[70vh] items-center justify-center px-4 py-8">
  <article class="w-full max-w-2xl rounded-3xl border border-amber-200 bg-white p-8 shadow-sm">
    <div
      class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-100 text-amber-700"
    >
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
        ></path>
      </svg>
    </div>

    <h1 class="mt-5 text-2xl font-bold text-slate-900">Acceso no autorizado</h1>
    <p class="mt-2 text-sm text-slate-600">
      Tu usuario inicio sesion correctamente, pero no tiene permisos para acceder a este modulo.
      Solo los roles 1 y 2 pueden usar estas opciones.
    </p>

    <div class="mt-6 flex flex-wrap gap-3">
      <button
        type="button"
        class="inline-flex h-10 items-center rounded-lg border border-slate-300 bg-white px-4 text-sm font-semibold text-slate-700 transition hover:bg-slate-50"
        (click)="logout()"
      >
        Cerrar sesion
      </button>
    </div>
  </article>
</section>
